name: Trivy

on:
  push:
    branches: [master]
  schedule:
    - cron: "51 5 * * 1"

# Deliberately not run on pull_request. Every alert Trivy finds lives in
# bun.lock and comes from transitive deps we do not control. On a PR, code
# scanning tries to attribute alerts to changed lines, and any PR with a
# sizeable lockfile diff trips its "code changes were too large" fallback --
# it then reports every pre-existing alert in the file as new and fails the
# check. Scanning still runs on master and weekly, so the alerts are tracked;
# they just no longer block unrelated PRs.

jobs:
  scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          sarif_file: trivy-results.sarif
